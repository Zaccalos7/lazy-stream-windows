<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40" role="img" aria-hidden="true" focusable="false">
  <!-- Taegukgi, on the official construction with the height as 48 units: the taegeuk is half the
       height across, a bar is a quarter of it long and 1/24 of it thick, the bars and the cut of a
       broken one are 1/48 apart, and every trigram starts 1/8 of the height out of the circle. The
       taegeuk and the trigrams lie on the two diagonals of the flag (atan 2/3 = 33.69°). -->
  <defs><clipPath id="c"><rect width="60" height="40" rx="3"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="60" height="40" fill="#FFFFFF"/>
    <g transform="translate(30 20) scale(0.8333333)">
      <!-- The top-left to bottom-right diagonal: geon (☰) above, gon (☷) below, and the taegeuk,
           red over blue, turned to follow it. -->
      <g transform="rotate(-56.3099325)">
        <path d="M-6-25H6M-6-22H6M-6-19H6M-6 19H6M-6 22H6M-6 25H6" stroke="#000000" stroke-width="2"/>
        <path d="M0 17v10" stroke="#FFFFFF" stroke-width="1"/>
        <circle r="12" fill="#CD2E3A"/>
        <path d="M0-12A6 6 0 0 0 0 0A6 6 0 0 1 0 12A12 12 0 0 1 0-12Z" fill="#0047A0"/>
      </g>
      <!-- The other diagonal: ri (☲) at the bottom left, gam (☵) at the top right. -->
      <g transform="rotate(-123.6900675)">
        <path d="M-6-25H6M-6-22H6M-6-19H6M-6 19H6M-6 22H6M-6 25H6" stroke="#000000" stroke-width="2"/>
        <path d="M0-23.5v3M0 17v3.5M0 23.5v3" stroke="#FFFFFF" stroke-width="1"/>
      </g>
    </g>
  </g>
</svg>
